# Fascia di rilascio - su procedura esplicita (docs/01_technical/09-integrazione-continua-e-rilascio.md
# §2).
#
# Vi appartengono la costruzione riproducibile, la distinta dei materiali generata per ogni
# artefatto, la firma con identità effimera della pipeline, le attestazioni di provenienza e il
# rapporto di tracciabilità (§§6-8 di quel capitolo).
#
# Oggi il solo artefatto pubblicato è il sito di documentazione. La sua distinta si genera in DUE
# luoghi, e non è una duplicazione: sono due costruzioni diverse dello stesso sito. Il lavoro
# «distinta-dei-materiali» di fascia-completa.yml genera la distinta della costruzione che gira a
# ogni proposta di modifica, mai firmata; il lavoro «costruzione-e-firma-artefatti» di QUESTO
# flusso genera la distinta della costruzione che viene firmata e distribuita - corretto il 27
# agosto 2026, quando questo flusso firmava un artefatto senza aver mai generato la distinta della
# propria costruzione, appoggiandosi a quella (diversa) generata altrove. Il criterio 5 di T-03
# esige la distinta «a ogni costruzione, per ogni artefatto»: una costruzione che firma senza
# generare la propria non lo soddisfa, anche se un'altra costruzione dello stesso sito lo fa.
#
# Innesco: manuale ed esplicito, mai automatico. La procedura di rilascio è documentata in
# docs/01_technical/09-integrazione-continua-e-rilascio.md §10.

#
# LIMITE DI TEMPO SU OGNI LAVORO. Venti minuti, contro le sei ore del limite predefinito di GitHub.
# Il motivo non e' il costo ma un difetto senza correzione disponibile: «image-size», tirato da
# @docusaurus/mdx-loader, ha due vulnerabilita' di grado alto che permettono un ciclo infinito nei
# parser ICNS, JXL e HEIF, e la 2.0.2 installata e' l'ULTIMA versione pubblicata - non esiste una
# versione a cui salire. L'esposizione oggi e' remota, perche' il repository contiene sei sole
# immagini e sono tutte SVG, formato che quei parser non toccano; ma una proposta di modifica che
# ne introducesse una artefatta bloccherebbe un esecutore per sei ore. Il limite non corregge la
# vulnerabilita' e non pretende di farlo: ne limita la durata.
name: Fascia di rilascio

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  costruzione-e-firma-artefatti:
    name: Costruzione, firma e attestazione degli artefatti
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Controllo del codice
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ALLINEATO ALLE ALTRE CORSIE IL 27 AGOSTO 2026, e la divergenza precedente merita di essere
      # raccontata perche' e' il genere di cosa che solo una corsia mai eseguita puo' nascondere.
      # Questa corsia usava setup-node@v4 e node-version 24.x, mentre docs.yml e fascia-completa.yml
      # usano @v5 e node 22. Due conseguenze, in ordine di gravita':
      #
      # 1. LA CORSIA CHE FIRMA COSTRUIVA UN ARTEFATTO DIVERSO da quella che pubblica. Un artefatto
      #    firmato ha senso se e' l'artefatto che le persone ricevono; costruito con un major di Node
      #    diverso non e' garantito che lo sia, e la firma attesterebbe qualcosa che nessuno ha visto.
      # 2. Node 24 porta npm 11, e «npm ls --all» - il comando che @cyclonedx/cyclonedx-npm esegue
      #    per produrre la distinta - fallisce con npm 11.6.3: «Cannot read properties of undefined
      #    (reading 'ruleset')». Misurato in locale il 27 agosto 2026. Il passo della distinta di
      #    QUESTA corsia sarebbe quindi fallito alla prima esecuzione, e questa corsia non e' mai
      #    stata eseguita: zero esecuzioni, zero rilasci.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Costruzione del sito di documentazione (italiano e inglese)
        run: |
          cd website
          npm ci
          npm run build

      # Criterio 5 di T-03: «la distinta dei materiali è generata a ogni costruzione, per ogni
      # artefatto, e non per il solo servizio principale». Fino al 27 agosto 2026 questo flusso -
      # quello che COSTRUISCE E FIRMA l'artefatto distribuito - non generava alcuna distinta: si
      # appoggiava a un'esecuzione separata del lavoro «distinta-dei-materiali» di
      # fascia-completa.yml, che costruisce lo stesso sito ma non è la costruzione che viene
      # firmata. Un artefatto firmato senza la distinta generata dalla SUA costruzione dichiara la
      # provenienza del contenuto senza dichiarare di che cosa è fatto. Genera qui, PRIMA dei passi
      # di firma, nella stessa forma già usata dal lavoro «distinta-dei-materiali» di
      # fascia-completa.yml: stesso comando, stesso --package-lock-only per la stessa ragione (la
      # camminata dell'albero via «npm ls» va in errore dentro @npmcli/arborist quando il campo
      # «overrides» di website/package.json punta a dipendenze transitive - vedi il commento
      # gemello in fascia-completa.yml), stesso controllo del registro dei componenti.
      - name: Generazione della distinta dei materiali (T-03, criterio 5)
        working-directory: website
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file ../sbom-website.json --omit dev --package-lock-only

      - name: Generazione del registro dei componenti di terze parti (T-03, criterio 6)
        # Il criterio 6 chiede due cose. La seconda - «un componente presente nella distinta e
        # assente dalle annotazioni fa fallire la costruzione» - e' il passo qui sotto, e c'era
        # dal principio. La PRIMA - «il registro e' GENERATO dalla distinta e arricchito da un
        # file di annotazioni versionato» - non esisteva fino al 27 agosto 2026: c'erano le
        # annotazioni e c'era il confronto, non c'era il registro.
        #
        # La differenza non e' terminologica. Le annotazioni dicono che cosa il progetto pensa di
        # ciascun componente; la distinta dice che cosa e' entrato nell'artefatto. Il registro e'
        # la loro giunzione, ed e' l'unico dei tre che risponda alla domanda che chi installa pone
        # davvero: che cosa sto installando, con quale licenza, e chi ce l'ha messo.
        run: python3 scripts/genera-registro-componenti.py sbom-website.json registro-generato
      - name: Verifica del registro dei componenti (G2, G5)
        run: ./scripts/verifica-registro-componenti.sh

      - uses: actions/upload-artifact@v4
        # if: always() e non il default, per la stessa ragione del lavoro gemello in
        # fascia-completa.yml: se la verifica sopra fallisce, l'artefatto che ha fatto fallire il
        # controllo resta comunque scaricabile per l'indagine.
        if: always()
        with:
          name: distinta-dei-materiali-rilascio
          path: sbom-website.json
          retention-days: 90

      - name: Dichiarazione di non marcatura nell'artefatto (T01-C7)
        # Sta QUI perche' i due passi che seguono FIRMANO l'artefatto: una firma su un artefatto
        # non verificato attesta la provenienza di un contenuto che nessuno ha guardato. Fino al 27 agosto 2026 il controllo esisteva, era provato e girava - su una
        # corsia separata, che diventava rossa in parallelo mentre questa distribuiva lo stesso.
        # Un artefatto pubblicato senza la dichiarazione resta pubblicato e la copia e' gia' stata
        # scaricata: e' il danno che il criterio 7 di T-01 chiama irrecuperabile, ed e' la ragione
        # per cui il traguardo e' di classe A. Voce D-13 del runbook, applicata al caso peggiore:
        # una tabella che dice dove sta un controllo non dice che il controllo sia sul percorso
        # che conta.
        run: |
          ./scripts/verifica-dichiarazione-non-marcatura.sh website/build
          ./scripts/verifica-dichiarazione-non-marcatura.sh website/build/en

      - name: Installazione di cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.10.1

      - name: Firma del sito italiano
        run: |
          bash scripts/firma-artefatto.sh \
            website/build \
            website/build.sig \
            website/build.att
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Firma del sito inglese
        run: |
          bash scripts/firma-artefatto.sh \
            website/build/en \
            website/build-en.sig \
            website/build-en.att
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Visualizzazione degli artefatti firmati
        run: |
          echo "Artefatti della fascia di rilascio:"
          ls -lh website/build.* website/build/en 2>/dev/null | head -20
          echo
          echo "Firma del sito italiano:"
          cat website/build.sig | head -c 80
          echo "..."
          echo
          echo "Attestazione di provenienza (sito italiano):"
          cat website/build.att | jq '.predicate.invocation.parameters' 2>/dev/null || echo "Attestazione generata"

      - name: Controllo di firma e provenienza
        run: |
          bash scripts/verifica-firma-e-provenienza.sh
        env:
          WORKFLOW_FILE: .github/workflows/fascia-di-rilascio.yml
          REPO: ${{ github.repository }}

      # UNA FIRMA CHE NESSUNO PUÒ SCARICARE NON È UNA FIRMA.
      #
      # Fino alla prima esecuzione riuscita del 27 agosto 2026 questa corsia produceva quattro file
      # di firma e attestazione e li lasciava morire con la macchina virtuale: pubblicava soltanto
      # la distinta dei materiali. Il difetto non si vedeva perché la corsia non era mai arrivata
      # fin qui, e non è dell'ordine del refuso: il criterio 8 di T-03 chiede che la procedura di
      # VERIFICA-DELL-ARTEFATTO.md sia dimostrata su un artefatto firmato, e non è dimostrabile su
      # un file che non esiste più.
      #
      # Si pubblicano tutti e tre gli elementi che la verifica richiede, insieme: l'ARCHIVIO che è
      # stato firmato - non la cartella, che nessuno potrebbe ricomprimere ottenendo gli stessi
      # byte -, la FIRMA e l'ATTESTAZIONE di provenienza. Chi verifica non deve ricostruire nulla.
      - name: Pubblicazione degli artefatti firmati
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artefatti-firmati
          path: |
            website/build.tar.gz
            website/build.sig
            website/build.att
            website/build/en.tar.gz
            website/build-en.sig
            website/build-en.att
          retention-days: 90
