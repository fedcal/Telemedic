# Verifiche che devono poter fallire.
#
# Ogni lavoro qui dentro corrisponde a un impegno preso nella documentazione. Un
# impegno che nessun controllo può smentire non è un impegno: è un'intenzione.
name: Verifiche

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminologie:
    name: Terminologie sotto licenza
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/verifica-terminologie.sh

  redazionale:
    name: Conformità redazionale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/verifica-conformita-redazionale.sh

  segreti:
    name: Ricerca di segreti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  distinta-dei-materiali:
    name: Distinta dei materiali del sito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Installazione
        working-directory: website
        run: npm ci
      # La distinta si genera dalla risoluzione effettiva delle dipendenze, mai
      # a mano: un inventario compilato a mano mente entro tre mesi.
      - name: Generazione della distinta
        working-directory: website
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file ../sbom-website.json --omit dev
      - uses: actions/upload-artifact@v4
        with:
          name: distinta-dei-materiali
          path: sbom-website.json
          retention-days: 90

  divergenza-traduzioni:
    name: Divergenza fra italiano e inglese
    runs-on: ubuntu-latest
    # Non bloccante finché le tre aree esigite da D56 — guida dei fondamenti,
    # sicurezza, conformità — non sono tradotte per intero. Diventa bloccante
    # nello stesso commit in cui l'ultima di quelle aree viene completata: un
    # controllo che non può fallire è teatro, e lasciarlo permanentemente
    # indulgente sarebbe il modo più rapido per abituarsi a ignorarlo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # il controllo confronta le date registrate in git
      - run: ./scripts/verifica-divergenza-traduzioni.sh
