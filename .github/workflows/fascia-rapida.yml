# Fascia rapida - a ogni invio (docs/01_technical/09-integrazione-continua-e-rilascio.md §2).
#
# Sta qui ciò che deve intercettare un problema prima che la proposta di modifica esista: un
# segreto committato è già nella cronologia di un repository pubblico nel momento in cui arriva a
# GitHub, non quando qualcuno apre una pull request su di esso. Per questo l'innesco è il push, su
# qualunque ramo, e non la sola pull request - è il motivo di collocazione dichiarato per G1 in
# pipeline/collocazione-dei-controlli.tsv.
#
# LIMITE DI TEMPO SU OGNI LAVORO. Venti minuti, contro le sei ore del limite predefinito di GitHub.
# Il motivo non e' il costo ma un difetto senza correzione disponibile: «image-size», tirato da
# @docusaurus/mdx-loader, ha due vulnerabilita' di grado alto che permettono un ciclo infinito nei
# parser ICNS, JXL e HEIF, e la 2.0.2 installata e' l'ULTIMA versione pubblicata - non esiste una
# versione a cui salire. L'esposizione oggi e' remota, perche' il repository contiene sei sole
# immagini e sono tutte SVG, formato che quei parser non toccano; ma una proposta di modifica che
# ne introducesse una artefatta bloccherebbe un esecutore per sei ore. Il limite non corregge la
# vulnerabilita' e non pretende di farlo: ne limita la durata.
name: Fascia rapida

on:
  push:
  # Il push da solo non basta, e il motivo e' il fork. Un contributore esterno spinge sul PROPRIO
  # repository: quel push non innesca nulla qui, e senza «pull_request» la sua proposta arriverebbe
  # senza che la ricerca di segreti, i dati sintetici e le ancore l'abbiano mai vista. Peggio: se
  # uno di questi controlli fosse fra quelli obbligatori della protezione del ramo, la proposta
  # resterebbe bloccata per sempre in attesa di un controllo che non parte. I due inneschi non si
  # sostituiscono - il push presidia la cronologia di questo repository, la pull request presidia
  # il contributo che arriva da fuori - e per un progetto aperto servono entrambi.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segreti:
    name: Ricerca di segreti
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dati-sintetici:
    name: Dati non sintetici (G10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # G10 (tabella di 10_fondamenti/17-ambiente-di-sviluppo.md §9.2) - forme riconoscibili di
    # identificativo reale nei sorgenti, nelle fixture e negli esempi. È l'automazione della prima
    # regola non negoziabile del progetto: nessun dato reale di paziente, mai (CONTRIBUTING.md,
    # CLAUDE.md). Sta nella fascia rapida e non nella completa per la stessa ragione di G1, non per
    # il costo - che pure è di sei decimi di secondo sull'intero repository
    # (scripts/verifica-dati-sintetici.sh): la proprietà che presidia è IRRECUPERABILE. Un dato
    # reale committato resta nella cronologia del repository anche dopo che il file è stato
    # corretto - è esattamente il criterio con cui il criterio 2 di T-03
    # (docs/09_roadmap/02-traguardi.md) individua il sottoinsieme bloccante da subito: proprietà
    # irrecuperabile o divieto pubblico, non comodità.
    #
    # OGGI QUESTO CONTROLLO FALLISCE, DELIBERATAMENTE NON ATTENUATO. Al momento in cui questo
    # lavoro è stato scritto (26 agosto 2026) sono presenti sul ramo principale trentasette codici
    # fiscali con carattere di controllo valido (DM 23 dicembre 1976): il controllo li segnala, e
    # la correzione è in corso da parte di un altro agente e del coordinatore. Il lavoro resta
    # bloccante e senza continue-on-error: un controllo "per ora" indulgente sulla regola non
    # negoziabile numero uno del progetto sarebbe esattamente la riduzione temporanea che il
    # criterio 4 di T-03 vieta di lasciar diventare permanente. Che la costruzione resti rossa
    # finché i trentasette casi non sono corretti è il comportamento CORRETTO di questo lavoro, non
    # un suo difetto.
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/verifica-dati-sintetici.sh

  ancore:
    name: Riferimenti interni - ancore (G9, meta')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # G9 (docs/10_fondamenti/17-ambiente-di-sviluppo.md §9.2) fa fallire su un collegamento interno
    # rotto. Questo lavoro copre solo la META' di G9: le ANCORE (#frammento), non i collegamenti fra
    # documenti. Ogni rinvio con ancora deve trovare, nel documento bersaglio, un titolo che genera
    # quell'ancora - su entrambe le lingue, verificate separatamente, perche' tradurre un titolo
    # cambia l'ancora che genera e un rinvio non aggiornato punta a un ancoraggio che nella pagina
    # tradotta non esiste piu'.
    #
    # PERCHE' ESISTE NONOSTANTE LA COSTRUZIONE DEL SITO SEGNALI GIA' LE ANCORE ROTTE. Le segnala e
    # basta: la costruzione ESCE CON SUCCESSO lo stesso, perche' i tre criteri onBroken* di
    # Docusaurus sono impostati a «warn». Un avviso che non ferma nulla non e' un controllo, e' una
    # riga di log che nessuno legge finche' non serve. Portare quei criteri a «throw» e' il criterio
    # 1 di T-07, non di questo lavoro: fino a quel momento, il sito costruito puo' pubblicare
    # un'ancora rotta senza che nulla lo impedisca, ed e' esattamente il buco che questo controllo
    # chiude nel frattempo.
    #
    # PERCHE' NELLA FASCIA RAPIDA E NON IN QUELLA COMPLETA. Costo contro beneficio, non comodita': lo
    # script (Python puro, nessuna dipendenza da installare) impiega meno di un secondo a esaminare
    # l'intero corpus, contro i minuti della costruzione del sito nel lavoro
    # «dichiarazione-non-marcatura» di fascia-completa.yml. E' bloccante e senza continue-on-error
    # dal primo giorno: non presuppone codice applicativo (V-182 non lo tocca, e' documentazione),
    # quindi non c'e' ragione per farlo aspettare.
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/verifica-ancore.sh

  dco:
    name: Developer Certificate of Origin (RD-C2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CONTRIBUTING.md paragrafo 147 prescrive il «Signed-off-by» per ogni commit. Al 26 agosto
    # 2026, dei 36 commit della cronologia, ne portavano il marcatore cinque: era una regola
    # scritta e non osservata da chi l'ha scritta, e questo lavoro la rende esigibile.
    #
    # «fetch-depth: 0» serve perche' il controllo confronta l'intervallo con origin/main, e senza
    # la cronologia completa quell'intervallo non si risolve. E' l'unico costo del lavoro.
    #
    # Il controllo NON esamina tutta la cronologia, ma l'intervallo non ancora spinto: pretendere
    # il marcatore da commit scritti prima che il controllo esistesse renderebbe il cancello
    # impossibile da soddisfare, e un cancello impossibile non e' un cancello - e' un cancello
    # che qualcuno finira' per aggirare.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # L'intervallo si dichiara qui invece di lasciarlo dedurre allo script, perche' i due
      # inneschi hanno due risposte diverse e nessuna delle due e' «origin/main..HEAD»:
      #
      #   pull_request - i commit della proposta sono quelli fra la base dell'unione e la testa,
      #                  e la base la sa solo GitHub;
      #   push         - sono quelli fra lo stato precedente del ramo e quello nuovo. Al primo
      #                  invio su un ramo nuovo «before» e' tutto zeri, e in quel caso si esamina
      #                  il solo commit di testa invece di tutta la cronologia del progetto.
      - name: Developer Certificate of Origin sui commit dell'intervallo
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TESTA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            INTERVALLO="${TESTA}~1..${TESTA}"
          else
            INTERVALLO="${BASE}..${TESTA}"
          fi
          echo "Intervallo esaminato: $INTERVALLO"
          INTERVALLO="$INTERVALLO" ./scripts/verifica-dco.sh

  trattini:
    name: Convenzione dei trattini (CV-C1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # La convenzione tipografica dichiarata in CLAUDE.md: il trattino corto sempre, il medio solo
    # fra due cifre in un intervallo numerico, il lungo mai. Fino al 26 agosto 2026 nessun
    # controllo ne guardava nemmeno uno - la regola scritta nominava due caratteri su tre e taceva
    # sul medio, che nel frattempo era arrivato a novecentoventi occorrenze in centotrentotto file,
    # duecentosettanta delle quali fuori da un intervallo numerico.
    #
    # PERCHE' NELLA FASCIA RAPIDA. Non per irrecuperabilita': un trattino sbagliato si corregge, e
    # la cronologia di git non ne conserva alcun danno. Non e' quindi il metro con cui il criterio
    # 2 di T-03 colloca qui G1, G10 e G11. La ragione e' quella di G9, il lavoro «ancore» qui
    # sopra, e sta in un legame tecnico fra i due: il trattino medio e quello lungo vengono RIMOSSI
    # dall'algoritmo dell'ancora, mentre quello corto RESTA. Correggere un trattino dentro un
    # titolo ne cambia percio' l'ancora, e ogni rinvio a quel titolo va ricalcolato in entrambe le
    # lingue. I due controlli devono girare nella stessa corsia e nello stesso momento, perche' la
    # correzione richiesta dal primo e' precisamente l'input del secondo: separarli significherebbe
    # scoprire l'ancora rotta minuti dopo, in un'altra fascia, senza il rilievo che l'ha causata
    # sotto gli occhi. Il costo lo consente: Python puro, nessuna dipendenza da installare, un
    # secondo e quattro decimi su quattrocentocinquanta file di testo, misurato il 26 agosto 2026.
    #
    # BLOCCANTE DAL PRIMO GIORNO, SENZA «continue-on-error» E SENZA DATA DI RIDUZIONE. Il corpus e'
    # a zero violazioni nel momento in cui questo lavoro entra: le duecentosettanta occorrenze
    # illegittime sono state corrette in entrambe le lingue prima di collocarlo. Un controllo che
    # nasce su un corpus gia' pulito non ha alcuna ragione per nascere indulgente, e una riduzione
    # senza necessita' e' esattamente cio' che il criterio 4 di T-03 vieta di lasciar diventare
    # permanente.
    #
    # CHE COSA QUESTO PASSO NON ESAMINA. La cartella scripts/prove, esclusa dal controllo perche'
    # le sue tenute contengono materiale deliberatamente scorretto - fra cui un trattino lungo
    # necessario al collaudo di verifica-ancore.sh. E' un limite dichiarato, non una copertura: un
    # trattino sbagliato scritto dentro una tenuta non viene visto.
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/verifica-trattini.sh

  termini-vietati:
    name: Regola di riservatezza R0 (G11) - in sola segnalazione fino al 2026-09-26
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # G11 (tabella di docs/01_technical/09-integrazione-continua-e-rilascio.md §3 e di
    # docs/10_fondamenti/17-ambiente-di-sviluppo.md §9.2) traduce in controllo la regola R0: nessun
    # nome di azienda, marchio, prodotto commerciale o dominio di un potenziale partner compare in
    # alcun artefatto del progetto, e si scrive sempre la categoria generica. La riservatezza
    # protetta non e' del progetto: e' di un terzo, e il progetto la custodisce per conto suo.
    #
    # PERCHE' NELLA FASCIA RAPIDA, E NON NELLA COMPLETA. Non per il costo, che pure e' basso: un
    # secondo e quattro decimi sull'intero repository, misurato il 26 agosto 2026 su
    # quattrocentoquarantaquattro file di testo. La fascia la decide IL MOMENTO IN CUI IL DANNO SI PRODUCE, ed
    # e' l'invio, non la proposta di modifica. Un nome protetto spinto su un repository pubblico e'
    # pubblicato in quell'istante: viene clonato, indicizzato e archiviato prima che chiunque possa
    # accorgersene, e la cronologia di git lo conserva anche dopo che il file e' stato corretto.
    # La proprieta' che R0 presidia e' quindi IRRECUPERABILE - il piano di G11 la enuncia cosi',
    # «un periodo di pubblicazione non si annulla» - ed e' lo stesso metro con cui il criterio 2 di
    # T-03 colloca G1 e G10 in questa fascia. Un controllo di riservatezza che girasse solo alla
    # proposta di modifica arriverebbe sempre dopo il fatto che doveva impedire.
    #
    # PERCHE' «continue-on-error» E CON UNA DATA. Il controllo oggi ESCE ROSSO, e non per un
    # difetto: segnala centoventiquattro rilievi, di cui centodiciotto negli appunti di ricerca
    # sotto .telemedic/, che sono citazioni di fonti - fra cui studi legali e societa' di
    # consulenza regolatoria. Se R0 li riguardi non e' una decisione di chi contribuisce ne' di chi
    # ha scritto il controllo: e' del committente, ed e' la questione aperta al §7 e §10 del piano
    # .telemedic/piani/G11-regola-di-riservatezza.md. Renderlo bloccante prima di quella decisione
    # produrrebbe un cancello sempre rosso, cioe' un cancello che nessuno legge piu' - il rischio
    # gia' registrato in Q-288. La riduzione ha percio' una data e non e' a tempo indeterminato: il
    # 26 settembre 2026, termine del criterio 2 di T-03, che e' anche il termine entro cui quella
    # decisione va presa. La data e' dichiarata in pipeline/collocazione-dei-controlli.tsv, dove
    # scripts/verifica-collocazione-dei-controlli.sh la sorveglia da se': dal giorno indicato,
    # lasciare qui «continue-on-error» senza aggiornare quella riga fa fallire la fascia completa.
    #
    # CHE COSA QUESTO PASSO NON ESEGUE, DETTO PERCHE' UN VERDE NON VALGA PIU' DI QUANTO VALE.
    # Lo strato SPECIFICO - l'elenco dei termini per impronta - resta spento: vive fuori dal
    # repository per la ragione scritta nel piano (la storia di git non dimentica, e un elenco
    # versionato sarebbe la violazione che il controllo esiste per impedire), e si accende
    # impostando TERMINI_VIETATI_ELENCO su un file materializzato da un segreto della piattaforma.
    # Finche' il committente non dichiara se quella lista esista, non c'e' nulla da montare. Il
    # controllo lo dichiara da se' a ogni esecuzione, verde o rosso che sia.
    # Restano inoltre non esaminati i MESSAGGI DI COMMIT, che R0 nomina esplicitamente: il
    # controllo li esamina solo sull'intervallo indicato in TERMINI_VIETATI_COMMIT, e l'espressione
    # che calcola quell'intervallo e' diversa per l'invio e per la proposta di modifica. Non e'
    # scritta qui perche' nessuno l'ha ancora eseguita sulla piattaforma, e un'espressione non
    # provata che finisse in errore di configurazione darebbe un rosso che non riguarda R0. E'
    # debito dichiarato, non copertura.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/verifica-termini-vietati.sh
