# Costruisce e pubblica il sito di documentazione su GitHub Pages.
#
# Due lavori distinti di proposito: su una proposta di modifica si costruisce
# soltanto, senza pubblicare. Una documentazione che non compila non deve poter
# essere unita, ma nemmeno deve poter pubblicare da un ramo non rivisto.
#
# LIMITE DI TEMPO SU OGNI LAVORO. Venti minuti, contro le sei ore del limite predefinito di GitHub.
# Il motivo non e' il costo ma un difetto senza correzione disponibile: «image-size», tirato da
# @docusaurus/mdx-loader, ha due vulnerabilita' di grado alto che permettono un ciclo infinito nei
# parser ICNS, JXL e HEIF, e la 2.0.2 installata e' l'ULTIMA versione pubblicata - non esiste una
# versione a cui salire. L'esposizione oggi e' remota, perche' il repository contiene sei sole
# immagini e sono tutte SVG, formato che quei parser non toccano; ma una proposta di modifica che
# ne introducesse una artefatta bloccherebbe un esecutore per sei ore. Il limite non corregge la
# vulnerabilita' e non pretende di farlo: ne limita la durata.
name: Documentazione

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruzione:
    name: Costruzione
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # serve a showLastUpdateTime: senza storia, la data è falsa

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Installazione delle dipendenze
        working-directory: website
        run: npm ci

      - name: Costruzione del sito
        working-directory: website
        run: npm run build

      - name: Nessuna data di marcatura nei documenti pubblici (MARC-C1)
        # Sta QUI, nel flusso che pubblica, e non solo in una fascia: e' la lezione D-23 del
        # runbook applicata prima di pagarla una seconda volta. Una data di marcatura pubblicata
        # e' stata clonata e indicizzata prima che qualcuno la tolga, e una corsia separata che
        # diventa rossa dopo la pubblicazione non impedisce nulla.
        run: ./scripts/verifica-date-di-marcatura.sh

      - name: Dichiarazione di non marcatura nell'artefatto (T01-C7)
        # Sta QUI, e non solo in fascia completa, perche' questo e' il flusso che pubblica
        # davvero. Fino al 27 agosto 2026 il controllo esisteva, era provato e girava - su una
        # corsia separata, che diventava rossa in parallelo mentre questa distribuiva lo stesso.
        # Un artefatto pubblicato senza la dichiarazione resta pubblicato e la copia e' gia' stata
        # scaricata: e' il danno che il criterio 7 di T-01 chiama irrecuperabile, ed e' la ragione
        # per cui il traguardo e' di classe A. Voce D-13 del runbook, applicata al caso peggiore:
        # una tabella che dice dove sta un controllo non dice che il controllo sia sul percorso
        # che conta.
        run: |
          ./scripts/verifica-dichiarazione-non-marcatura.sh website/build
          ./scripts/verifica-dichiarazione-non-marcatura.sh website/build/en

      - name: Caricamento dell'artefatto
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  pubblicazione:
    name: Pubblicazione
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: costruzione
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
