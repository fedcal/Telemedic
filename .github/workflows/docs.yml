# Costruisce e pubblica il sito di documentazione su GitHub Pages.
#
# Due lavori distinti di proposito: su una proposta di modifica si costruisce
# soltanto, senza pubblicare. Una documentazione che non compila non deve poter
# essere unita, ma nemmeno deve poter pubblicare da un ramo non rivisto.
name: Documentazione

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  costruzione:
    name: Costruzione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # serve a showLastUpdateTime: senza storia, la data è falsa

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Installazione delle dipendenze
        working-directory: website
        run: npm ci

      - name: Costruzione del sito
        working-directory: website
        run: npm run build

      - name: Caricamento dell'artefatto
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  pubblicazione:
    name: Pubblicazione
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: costruzione
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
