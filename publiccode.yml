# Metadati di catalogo secondo lo standard publiccode.yml, adottato in Italia
# da AgID per il riuso del software nella pubblica amministrazione.
#
# Questo file descrive il progetto a chi lo cerca in un catalogo. Non è una
# dichiarazione di conformità e non attesta alcuna certificazione: quanto è
# dichiarato qui va letto insieme a NOT-A-MEDICAL-DEVICE.md e a
# DISTRIBUTION-POLICY.md, che dicono con precisione che cosa il progetto
# pubblica e che cosa resta a carico di chi lo installa.
publiccodeYmlVersion: "0.4"

name: Telemedic
url: "https://github.com/fedcal/Telemedic"
landingURL: "https://fedcal.github.io/Telemedic/"

