it:
  countryExtensionVersion: "0.2"

  # Tutte le voci sono `false` deliberatamente, e resteranno tali finché non
  # esisterà una verifica che possa fallire. Il progetto è in progettazione: una
  # conformità dichiarata senza prova è esattamente la formula che la stessa
  # documentazione di questo repository vieta di usare. Le voci si alzano a
  # `true` una per volta, quando la prova corrispondente è pubblicata ed eseguita
  # nella catena di integrazione continua — non prima.
  #
  # Va inoltre tenuto presente che alcune di queste conformità non sono
  # dichiarabili da un progetto software: appartengono al soggetto che eroga il
  # servizio. L'adempimento al regolamento generale sulla protezione dei dati è
  # del titolare del trattamento, non del programma che quel titolare installa.
  conforme:
    lineeGuidaDesign: false
    modelloInteroperabilita: false
    misureMinimeSicurezza: false
    gdpr: false

  # Il progetto è progettato per l'identità digitale nazionale ed è verificabile
  # su di essa, ma non è accreditato: il fornitore di servizi presso l'autorità è
  # chi installa, mai il progetto. Le voci restano `false` finché l'integrazione
  # non è realizzata e provata.
  piattaforme:
    spid: false
    cie: false
    anpr: false
    pagopa: false
    io: false
