# Configurazione di riferimento del nodo di relay - artefatto P7 di T-04.
#
# Non è la configurazione di un'installazione reale. Ogni indirizzo qui presente è sintetico e
# dichiarato come tale in P7-configurazione-di-riferimento-relay.md, che accompagna questo file
# e ne motiva ogni sezione riga per riga dove serve. Nessun segreto: gli unici valori sensibili
# sono i segnaposto ${TURN_STATIC_AUTH_SECRET} e ${TURN_STATELESS_NONCE_SECRET}, già i nomi
# stabiliti in docs/10_fondamenti/08-webrtc-da-zero.md §11.5, da iniettare con un gestore di
# segreti in ogni ambiente in cui questa configurazione viene effettivamente applicata.
#
# Versione minima del nodo di relay: quella dichiarata dal vincolo V-10
# (docs/11_registri/01-vincoli-in-vigore.md#v-10). Non ripetuta qui in cifra per non doverla
# mantenere in due posti: la cifra vive in un solo punto, il registro dei vincoli.
#
# Corrispondenza con i sei tentativi di P6-tentativi-di-allocazione.tsv dichiarata al §5 di
# P7-configurazione-di-riferimento-relay.md.

# =====================================================================================
# Ascolto - indirizzi enumerati esplicitamente, mai un indirizzo che leghi ogni interfaccia
# =====================================================================================
listening-ip=203.0.113.10
listening-port=3478
tls-listening-port=5349

relay-ip=10.0.10.20
external-ip=203.0.113.10/10.0.10.20

min-port=49152
max-port=65535

# =====================================================================================
# Autenticazione - credenziali effimere, nessuna base dati di utenti
# (docs/04_protocols/09-tempo-reale.md §7)
# =====================================================================================
realm=turn.telemedic.example
use-auth-secret
static-auth-secret=${TURN_STATIC_AUTH_SECRET}

# Chiave di firma dei valori usa e getta, condivisa fra i nodi indipendenti dell'architettura a
# N nodi (docs/10_fondamenti/08-webrtc-da-zero.md §11.6): senza di essa, dalla versione minima
# dichiarata da V-10 in poi, ogni richiesta che atterra su un nodo diverso da quello che ha
# emesso il nonce costa alla parte chiamante un ciclo di riautenticazione.
stateless-nonce-secret=${TURN_STATELESS_NONCE_SECRET}

# =====================================================================================
# COROLLARIO PRIMO (P7.md §2.1) - il comportamento predefinito è permissivo e il diniego
# globale non esiste come opzione: va costruito enumerando gli intervalli. Ogni riga di questa
# sezione è necessaria: nessuna riga è "coperta" da un'altra, e una riga dimenticata qui
# significa, per il comportamento predefinito, inoltro CONSENTITO verso quell'intervallo.
# =====================================================================================

# Interfaccia di ritorno IPv4 - tentativo 1 di P6
denied-peer-ip=127.0.0.0-127.255.255.255

# Rete privata, RFC 1918 - tentativo 4 di P6
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Traduzione condivisa di indirizzi fra fornitore e abbonato, RFC 6598
denied-peer-ip=100.64.0.0-100.127.255.255

# Link-local locale, RFC 3927: include il blocco in cui cade convenzionalmente il servizio di
# metadati dell'infrastruttura - tentativo 3 di P6, vedi anche il corollario quarto sotto
denied-peer-ip=169.254.0.0-169.254.255.255

# Blocchi di documentazione IPv4, RFC 5737: irraggiungibili per definizione, negati comunque
# per la completezza dell'enumerazione, non per un rischio reale
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255

# Multicast e riservato IPv4
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255

# =====================================================================================
# COROLLARIO QUARTO, seconda parte (P7.md §2.4) - l'indirizzo pubblico del nodo stesso.
# Senza questa riga il relay raggiunge i propri servizi passando dal proprio indirizzo pubblico
# invece che dall'interfaccia di ritorno, aggirando per intero la logica delle righe
# precedenti - tentativo 5 di P6. Coincide deliberatamente con listening-ip / external-ip qui
# sopra: va aggiornata a ogni cambio di indirizzo pubblico del nodo. La sua assenza è essa
# stessa il difetto che il tentativo 5 verifica: non è coperta da nessuna delle righe generiche
# di questa configurazione.
# =====================================================================================
denied-peer-ip=203.0.113.10

# =====================================================================================
# Forma IPv4 mappata in IPv6 - tentativo 2 di P6. Riga indipendente dalle righe IPv4 di sopra:
# la canonicalizzazione fra le due forme non si presume, si nega esplicitamente in entrambe.
# =====================================================================================
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255

# =====================================================================================
# COROLLARIO TERZO (P7.md §2.3) - ogni intervallo IPv6 di questa configurazione, senza
# eccezioni, è un prefisso allineato: mai un confine minimo-massimo arbitrario. È la
# contromisura al tentativo 6 di P6, ed è strutturale: la sua efficacia sta nell'assenza, in
# tutto questo file, della forma che il confronto componente per componente aggirerebbe - non
# in una riga singola dedicata a quel tentativo.
# =====================================================================================
denied-peer-ip=::1                                                   # loopback, /128
denied-peer-ip=::                                                    # non specificato, /128
denied-peer-ip=64:ff9b::-64:ff9b:0:ffff:ffff:ffff:ffff:ffff          # traduzione verso IPv4, /96
denied-peer-ip=100::-100:0:0:ffff:ffff:ffff:ffff:ffff                # discard-only, /64
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff     # documentazione, /32 - tentativo 6 di P6
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff        # locale unico, /7
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff        # link-local, /10
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff        # multicast, /8

# =====================================================================================
# COROLLARIO SECONDO (P7.md §2.2) - nessuna direttiva di lista consentiti in questo file, e
# nessuna va aggiunta. La regola documentata a monte è che un indirizzo presente in entrambe le
# liste è considerato consentito comunque: nel profilo sanitario la lista di indirizzi
# consentiti è un DIVIETO, non una preferenza. Questa sezione esiste per essere trovata VUOTA
# da chi legge, non per essere compilata in futuro.
# =====================================================================================
# (nessuna direttiva "allowed-peer-ip" - deliberatamente assente)

# =====================================================================================
# Superficie del nodo - misure complementari già dichiarate in
# docs/06_security/05-sicurezza-del-tempo-reale.md §4.4. NON sono fra i quattro corollari, ma
# sono coerenti con essi e compaiono qui per completezza operativa della configurazione di
# riferimento.
# =====================================================================================
no-multicast-peers
no-tcp-relay
no-cli

# Deliberatamente NON impostate, e la ragione è dichiarata in P7.md §6 e in
# docs/06_security/05-sicurezza-del-tempo-reale.md §4.4:
#   allow-loopback-peers   - annullerebbe il corollario primo per il solo loopback
#   mobility               - nessun beneficio in una sessione fra due parti
#   web-admin               - interfaccia di amministrazione, va disattivata
#   acme-redirect           - gestione dei certificati va fatta fuori dal nodo di relay

# Quote e limiti - contengono l'esaurimento di risorse, non l'isolamento verso destinazioni
# interne: non sono un corollario, sono elencate per completezza della configurazione.
user-quota=6
total-quota=1200
max-bps=400000
bps-capacity=125000000

# Punto di accesso alle metriche vincolato all'interfaccia di gestione, mai su ogni interfaccia
prometheus
prometheus-address=10.0.10.20
